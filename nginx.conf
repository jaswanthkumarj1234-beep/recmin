server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Probe endpoint for Docker HEALTHCHECK / load balancers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML and service worker must always be revalidated so new versions roll out immediately
    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self)" always;
        try_files $uri =404;
    }

    # Heavy static assets (voice clips, offline voice model) can be cached
    location ~* \.(wav|tar\.gz|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self)" always;
        try_files $uri $uri/ =404;
    }
}
