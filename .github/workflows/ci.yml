name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site checks (HTML, clips, assets)
        run: python tests/check_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r"<script>(.*?)</script>", html, re.S) if s.strip()]
          pathlib.Path("inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check inline.js
          node --check sw.js

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t recmin:ci .

      - name: Run container and probe it
        run: |
          docker run -d --name recmin -p 8080:8080 recmin:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Record Minutes Timer"
          curl -fsSI http://localhost:8080/sw.js | grep -i "cache-control: no-cache"
          curl -fsSI http://localhost:8080/clips/start.wav | grep -i "200"
          docker logs recmin
          docker rm -f recmin
